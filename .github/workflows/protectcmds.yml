name: protectcmds

# Builds protectcmds.ext.so (fmu1337/ProtectCMDS, css34; API 7 and API 9 variants) on debian:11 and
# publishes it as the release `protectcmds-<commit>` that install.sh downloads.

on:
  workflow_dispatch:
  push:
    paths:
      - extras/protectcmds/build.sh
      - .github/workflows/protectcmds.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:11
    steps:
      - name: Tools
        run: |
          # bullseye is being retired from deb.debian.org; pin a snapshot
          snap=20260813T000000Z
          rm -f /etc/apt/sources.list.d/*
          cat >/etc/apt/sources.list <<EOF
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/${snap} bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/${snap} bullseye-security main
          EOF
          apt-get update -qq
          apt-get install -y -qq git make gcc g++ gcc-multilib g++-multilib binutils ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Build
        run: extras/protectcmds/build.sh out
      - name: Check
        run: |
          for f in out/protectcmds-api*.ext.so; do
            echo "== $f"
            readelf -d "$f" | grep NEEDED
            objdump -T "$f" | grep -oE 'GLIBC(XX)?_[0-9.]+' | sort -Vu | tail -n 3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: protectcmds
          path: out/
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: protectcmds
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit="$(cat out/protectcmds.commit)"
          tag="protectcmds-${commit:0:7}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "ProtectCMDS ${commit:0:7} (css34, linux)" \
              --notes "protectcmds.ext.so built from fmu1337/ProtectCMDS@${commit} (ENGINE=css34) on debian:11: protectcmds-api7 (SM 1.6 SDK) for SourceMod 1.11/1.12, protectcmds-api9 (SM 1.13 SDK) for SourceMod 1.13. Used by install.sh --plugins protectcmds."
          fi
          gh release upload "$tag" out/protectcmds-api7.ext.so out/protectcmds-api9.ext.so --clobber
