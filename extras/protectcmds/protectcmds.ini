; ProtectCMDS (fmu1337/ProtectCMDS, fork of WeSTManCoder) settings, installed by v34_server_base.
; addons/sourcemod/data/protectcmds/protectcmds.ini

[ProtectCMDS]
protectcmds_enable = 1

[Updater]
; The upstream updater downloads binaries from a third-party site; keep it off.
protectcmds_updater_enable = 0
protectcmds_updater_experimental = 0

[BlockCmds]
; Detour of CGameClient::ExecuteStringCommand: sees every client command
; (also engine commands like status/ping), kicks above N commands per second,
; blocks the list in blockcmds.txt and calls ProtectCMDS_OnClientCommand.
blockcmds_enable = 1
blockcmds_maxcommands = 30

[FilterPacket]
filterpacket_enable = 1

[SteamIDHashing]
steamidhashing_enable = 1

[GamePacketFix]
gamepacketfix_enable = 1

[GameStats]
gamestats_enable = 1

[OSFix]
; Runtime memcpy -> memmove detour. The installer turns it off when the
; bufferfix binary patch is applied (same fix, done in the files).
osfix_enable = 1

[VACPatch]
vacpatch_enable = 1
